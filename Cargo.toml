[package]
name = "rusty_av2f"
version = "0.2.0"
edition = "2021"
# 1.82 for `Option::is_none_or`, used by the box walker's bounds check.
rust-version = "1.82"
description = "AV2F: an EXPERIMENTAL still-image container for AV2, in the shape of AVIF. Not an AOM standard — see the README before producing files."
license = "MIT"
repository = "https://github.com/Remade-With-Rust/rusty_av2f"
homepage = "https://github.com/Remade-With-Rust/rusty_av2f"
readme = "README.md"
keywords = ["av2", "image", "isobmff", "heif", "still"]
categories = ["multimedia::images", "multimedia"]

[dependencies]

[dev-dependencies]
# global allocator for bench/example roots (project convention)
rusty_alloc-api = "0.4"
